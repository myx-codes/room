version: "3.8"

services:
  roomi-frontend:
    container_name: roomi-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GRAPHQL_URL: /graphql
        VITE_UPLOADS_URL: /uploads
        VITE_WS_URL: /socket.io
        VITE_CSRF_URL: /csrf-token
        INTERNAL_GRAPHQL_URL: http://roomi-api:3008/graphql
    environment:
      NODE_ENV: production
      INTERNAL_GRAPHQL_URL: http://roomi-api:3008/graphql
    expose:
      - "80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - web
      - roomi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    external: true
    name: web
  roomi-net:
    external: true
